name: PinApp
options:
  bundleIdPrefix: com.pinapp
  deploymentTarget:
    iOS: "17.0"
targets:
  PinApp:
    type: application
    platform: iOS
    sources:
      - PinApp
    info:
      path: PinApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Pin App uses your location to check off nearby islands when you're within 50 meters."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinapp.PinApp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
